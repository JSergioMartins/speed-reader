    </div>
    
    <script>
        const API_URL = 'https://speed-reader-api-production.up.railway.app';

        // ── AuthManager ───────────────────────────────────────────────────────
        class AuthManager {
            constructor(onReady) {
                this.token = localStorage.getItem('authToken');
                this.user = null;
                this._onReady = onReady || (() => {});
                this.init();
            }
            
            async init() {
                if (this.token) {
                    try {
                        await this.loadUser();
                    } catch (error) {
                        this.logout();
                    }
                }
                this._onReady();
            }
            
            isAuthenticated() {
                return !!this.token;
            }
            
            getHeaders() {
                const headers = { 'Content-Type': 'application/json' };
                if (this.token) {
                    headers['Authorization'] = `Bearer ${this.token}`;
                }
                return headers;
            }
            
            async register(email, password, fullName = null) {
                const response = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, full_name: fullName })
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Registration failed');
                }
                
                const data = await response.json();
                this.token = data.access_token;
                localStorage.setItem('authToken', this.token);
                await this.loadUser();
                return this.user;
            }
            
            async login(email, password) {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Login failed');
                }
                
                const data = await response.json();
                this.token = data.access_token;
                localStorage.setItem('authToken', this.token);
                await this.loadUser();
                return this.user;
            }
            
            async loadUser() {
                const response = await fetch(`${API_URL}/auth/me`, {
                    headers: this.getHeaders()
                });
                
                if (!response.ok) throw new Error('Failed to load user');
                
                this.user = await response.json();
                return this.user;
            }
            
            logout() {
                this.token = null;
                this.user = null;
                localStorage.removeItem('authToken');
            }
            
            // User data methods
            async saveSession(bookHash, bookTitle, currentIndex, totalWords, wpm, theme, currentChapter = null, wordsReadDelta = 0) {
                if (!this.isAuthenticated()) return null;
                
                const response = await fetch(`${API_URL}/user/sessions`, {
                    method: 'POST',
                    headers: this.getHeaders(),
                    body: JSON.stringify({
                        book_hash: bookHash,
                        book_title: bookTitle,
                        current_word_index: currentIndex,
                        total_words: totalWords,
                        wpm: wpm,
                        theme: theme,
                        current_chapter: currentChapter,
                        // Words actually displayed during playback since last save.
                        // Zero for seeks/chapter jumps/rewinds — prevents stats inflation.
                        words_read_delta: wordsReadDelta,
                    })
                });
                
                if (response.ok) {
                    return await response.json();
                }
                return null;
            }
            
            async updateSession(sessionId, currentIndex, currentChapter = null) {
                if (!this.isAuthenticated()) return null;
                
                const response = await fetch(`${API_URL}/user/sessions/${sessionId}`, {
                    method: 'PATCH',
                    headers: this.getHeaders(),
                    body: JSON.stringify({
                        current_word_index: currentIndex,
                        current_chapter: currentChapter
                    })
                });
                
                if (response.ok) {
                    return await response.json();
                }
                return null;
            }
            
            async getSessions() {
                if (!this.isAuthenticated()) return [];
                
                const response = await fetch(`${API_URL}/user/sessions`, {
                    headers: this.getHeaders()
                });
                
                if (response.ok) {
                    return await response.json();
                }
                return [];
            }
            
            async getStats() {
                if (!this.isAuthenticated()) return null;
                
                const response = await fetch(`${API_URL}/user/stats`, {
                    headers: this.getHeaders()
                });
                
                if (response.ok) {
                    return await response.json();
                }
                return null;
            }
        }

        // ── SpeedReader ───────────────────────────────────────────────────────
        class SpeedReader {
            constructor() {
                this.words = [];
                this.chapters = [];
                this.currentIndex = 0;
                this.isPlaying = false;
                this.wpm = 300;
                this.intervalId = null;
                this.theme = 'day';
                this.currentBookHash = null;
                this.currentBookTitle = null;
                this.currentSessionId = null;
                
                // Reading mode: 'word' (one-at-a-time, instant) or 'rolling' (continuous ribbon)
                this.readingMode = localStorage.getItem('speedReaderMode') || 'word';
                
                // Rolling-mode state. Larger window = rarer rebuilds = smoother playback.
                // At 301 words with threshold 80, we rebuild roughly every 220 words
                // (vs every 13 with the old 41/8 config) — barely ever during reading.
                this.rollingWindowStart = 0;       // absolute index of first word in the rendered window
                this.rollingWindowSize = 301;      // odd number so "current" can sit at center
                this.rollingRebuildThreshold = 80; // rebuild when current word gets this close to an edge
                
                // Stats: words ACTUALLY DISPLAYED during playback since last save.
                // Incremented ONLY inside _startInterval tick. Reset on save.
                // Seeks via slider / chapter / arrow keys never touch this.
                this.sessionWordsRead = 0;
                
                this.auth = new AuthManager(() => this.updateAuthUI());
                
                this.initElements();
                this.initEventListeners();
                this.initAuthUI();
                this.loadTheme();
                this.applyReadingMode();  // set initial mode class
            }
            
            initElements() {
                this.wordDisplay = document.getElementById('word-display');
                this.rollingDisplay = document.getElementById('rolling-display');
                this.rollingRibbon = document.getElementById('rolling-ribbon');
                this.modeToggle = document.getElementById('modeToggle');
                this.progressSlider = document.getElementById('progressSlider');
                this.wpmSlider = document.getElementById('wpmSlider');
                this.wpmDisplay = document.getElementById('wpmDisplay');
                this.playPauseBtn = document.getElementById('playPauseBtn');
                this.rewindBtn = document.getElementById('rewindBtn');
                this.clearBtn = document.getElementById('clearBtn');
                this.fileInput = document.getElementById('fileInput');
                this.uploadArea = document.getElementById('uploadArea');
                this.uploadIcon = document.getElementById('uploadIcon');
                this.uploadText = document.getElementById('uploadText');
                this.uploadHint = document.getElementById('uploadHint');
                this.progressInfo = document.getElementById('progressInfo');
                this.statusContainer = document.getElementById('statusContainer');
                this.themeToggle = document.getElementById('themeToggle');
                this.themeIcon = document.getElementById('themeIcon');
                this.themeText = document.getElementById('themeText');
                
                // Auth elements
                this.authBtn = document.getElementById('authBtn');
                this.userMenu = document.getElementById('userMenu');
                this.userInfo = document.getElementById('userInfo');
                this.logoutBtn = document.getElementById('logoutBtn');
                this.authModal = document.getElementById('authModal');
                this.modalClose = document.getElementById('modalClose');
                this.loginForm = document.getElementById('loginForm');
                this.registerForm = document.getElementById('registerForm');
                this.showRegister = document.getElementById('showRegister');
                this.showLogin = document.getElementById('showLogin');
                this.authError = document.getElementById('authError');
            }
            
            initEventListeners() {
                // WPM slider
                this.wpmSlider.addEventListener('input', (e) => {
                    this.wpm = parseInt(e.target.value);
                    this.wpmDisplay.textContent = `${this.wpm} WPM`;
                    // Restart interval without triggering a save (avoids a POST per drag tick)
                    if (this.isPlaying) this._restartInterval();
                });
                
                // Reading mode toggle (segmented control)
                this.modeToggle.addEventListener('click', (e) => {
                    const btn = e.target.closest('.mode-btn');
                    if (!btn) return;
                    const mode = btn.dataset.mode;
                    if (mode === this.readingMode) return;
                    this.setReadingMode(mode);
                });
                
                // Control buttons
                this.playPauseBtn.addEventListener('click', () => this.togglePlayPause());
                this.rewindBtn.addEventListener('click', () => this.rewind());
                this.clearBtn.addEventListener('click', () => this.clear());
                
                // Progress slider. Two listeners:
                //   'input'  → fires continuously during drag. Updates display only;
                //              calls pause() on the first tick if playing (pause() itself
                //              only saves on play→pause transition, so no save storm).
                //   'change' → fires ONCE when drag ends. Persists the new position
                //              with countReadWords=false so the seek doesn't inflate stats.
                this.progressSlider.addEventListener('input', (e) => {
                    if (this.words.length === 0) return;
                    // Don't let interaction happen while locked (belt-and-suspenders —
                    // CSS pointer-events:none should already block this)
                    if (this.progressSlider.classList.contains('locked')) return;
                    if (this.isPlaying) this.pause();
                    const sliderValue = parseInt(e.target.value);
                    this.currentIndex = Math.max(0, Math.min(sliderValue, this.words.length - 1));
                    this.displayCurrent();
                    this.updateProgressDisplay();
                    this.updateChapterSelection();
                    if (this.readingMode === 'rolling') this.renderRollingWindow();
                });
                
                this.progressSlider.addEventListener('change', () => {
                    // Persist the seeked position. countReadWords=false because the
                    // drag itself doesn't display words during playback.
                    if (this.words.length === 0) return;
                    if (this.auth.isAuthenticated()) this.saveProgress(false);
                });
                
                // Theme toggle
                this.themeToggle.addEventListener('click', () => this.toggleTheme());
                
                // File upload - require login
                this.uploadArea.addEventListener('click', () => {
                    if (!this.auth.isAuthenticated()) {
                        this.showAuthModal();
                        return;
                    }
                    this.fileInput.click();
                });
                
                this.fileInput.addEventListener('change', (e) => this.handleFileUpload(e));
                
                // Drag and drop - require login
                this.uploadArea.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    if (this.auth.isAuthenticated()) {
                        this.uploadArea.classList.add('drag-over');
                    }
                });
                
                this.uploadArea.addEventListener('dragleave', () => {
                    this.uploadArea.classList.remove('drag-over');
                });
                
                this.uploadArea.addEventListener('drop', (e) => {
                    e.preventDefault();
                    this.uploadArea.classList.remove('drag-over');
                    
                    if (!this.auth.isAuthenticated()) {
                        this.showAuthModal();
                        this.showStatus('Please sign in to upload books', 'error');
                        return;
                    }
                    
                    const file = e.dataTransfer.files[0];
                    if (file) this.processFile(file);
                });
                
                // Keyboard shortcuts (only when NOT typing in a form field)
                document.addEventListener('keydown', (e) => {
                    const tag = e.target.tagName;
                    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
                    if (this.authModal.classList.contains('active')) return;
                    
                    if (e.code === 'Space') {
                        e.preventDefault();
                        this.togglePlayPause();
                    } else if (e.code === 'ArrowLeft') {
                        this.currentIndex = Math.max(0, this.currentIndex - 10);
                        this.displayCurrent();
                        this.updateProgress();
                        this.updateChapterSelection();
                        if (this.readingMode === 'rolling') this.renderRollingWindow();
                    } else if (e.code === 'ArrowRight') {
                        this.currentIndex = Math.min(this.words.length - 1, this.currentIndex + 10);
                        this.displayCurrent();
                        this.updateProgress();
                        this.updateChapterSelection();
                        if (this.readingMode === 'rolling') this.renderRollingWindow();
                    }
                });
            }
            
            showStatus(message, type = 'info') {
                this.statusContainer.innerHTML = `
                    <div class="status-message status-${type}">
                        ${message}
                    </div>
                `;
                setTimeout(() => {
                    this.statusContainer.innerHTML = '';
                }, 6000);
            }
            
            async handleFileUpload(e) {
                const file = e.target.files[0];
                if (file) await this.processFile(file);
            }
            
            async processFile(file) {
                const allowed = ['.txt', '.pdf', '.epub', '.mobi', '.azw', '.azw3', '.acsm'];
                const name = file.name.toLowerCase();
                
                if (!allowed.some(ext => name.endsWith(ext))) {
                    this.showStatus('Unsupported file type. Accepted: TXT, PDF, EPUB, MOBI.', 'error');
                    return;
                }
                
                this.showStatus(`⏳ Uploading and parsing ${file.name}...`, 'info');
                this.pause();
                
                try {
                    const formData = new FormData();
                    formData.append('file', file);
                    
                    // Include auth if available. DO NOT set Content-Type — the
                    // browser must set it with the multipart boundary itself.
                    const headers = {};
                    if (this.auth.isAuthenticated()) {
                        headers['Authorization'] = `Bearer ${this.auth.token}`;
                    }
                    
                    const response = await fetch(`${API_URL}/parse`, {
                        method: 'POST',
                        headers,
                        body: formData,
                    });
                    
                    if (!response.ok) {
                        const err = await response.json().catch(() => ({}));
                        throw new Error(err.detail || `Server error: ${response.status}`);
                    }
                    
                    const data = await response.json();
                    
                    // Load words and chapters from API response
                    this.words = data.words;
                    this.chapters = data.chapters;
                    this.currentIndex = 0;
                    
                    // Generate book hash and save title for progress tracking
                    this.currentBookTitle = file.name.replace(/\.[^/.]+$/, '');
                    this.currentBookHash = this.generateBookHash(file.name, data.totalWords);
                    
                    // ── Restore saved progress if user is logged in ─────────
                    let restored = false;
                    if (this.auth.isAuthenticated()) {
                        try {
                            const sessions = await this.auth.getSessions();
                            const existing = sessions.find(s => s.book_hash === this.currentBookHash);
                            if (existing && existing.current_word_index > 0) {
                                this.currentIndex = Math.min(existing.current_word_index, this.words.length - 1);
                                this.currentSessionId = existing.id;
                                // Restore WPM preference
                                if (existing.wpm) {
                                    this.wpm = existing.wpm;
                                    this.wpmSlider.value = this.wpm;
                                    this.wpmDisplay.textContent = `${this.wpm} WPM`;
                                }
                                restored = true;
                            }
                        } catch (e) {
                            console.error('Failed to restore progress:', e);
                        }
                    }
                    
                    this.updateProgress();
                    this.displayCurrent();
                    
                    // Only create a new session entry for books we haven't seen.
                    // This is a positional save (no reading has happened) — delta 0.
                    if (this.auth.isAuthenticated() && !restored) {
                        await this.saveProgress(false);
                    }
                    
                    if (this.chapters.length > 0) {
                        this.showChapterSelector();  // also calls updateChapterSelection()
                    } else {
                        this.hideChapterSelector();
                    }
                    
                    // ── Build status message ────────────────────────────────
                    let status = `✅ Loaded: ${file.name}`;
                    if (data.totalChapters > 0) status += ` — ${data.totalChapters} chapters,`;
                    status += ` ${data.totalWords} words`;
                    if (restored) {
                        const pct = Math.round((this.currentIndex / this.words.length) * 100);
                        status += ` | 📖 Resumed at ${pct}%`;
                    }
                    this.showStatus(status, 'info');
                    
                    // Update upload bar to show current book
                    this.uploadIcon.textContent = '📗';
                    this.uploadText.textContent = this.currentBookTitle;
                    this.uploadHint.textContent = 'Tap to load a different book';
                    
                } catch (error) {
                    console.error('Parse error:', error);
                    this.showStatus(`❌ Error: ${error.message}`, 'error');
                }
            }
            
            togglePlayPause() {
                if (this.isPlaying) {
                    this.pause();
                } else {
                    this.play();
                }
            }
            
            play() {
                if (this.words.length === 0) {
                    this.showStatus('Please load a book first!', 'error');
                    return;
                }
                
                if (this.currentIndex >= this.words.length) {
                    this.currentIndex = 0;
                }
                
                this.isPlaying = true;
                this.playPauseBtn.innerHTML = '⏸ Pause';
                // Lock the progress slider to prevent miss-clicks during playback
                this.progressSlider.classList.add('locked');
                
                // Make sure the rolling ribbon is rendered and positioned before we start
                if (this.readingMode === 'rolling') {
                    this.renderRollingWindow();
                }
                
                // Start auto-save interval
                this.startAutoSave();
                this._startInterval();
            }
            
            _startInterval() {
                if (this.intervalId) clearInterval(this.intervalId);
                const interval = 60000 / this.wpm; // ms per word
                
                this.intervalId = setInterval(() => {
                    if (this.currentIndex < this.words.length - 1) {
                        this.currentIndex++;
                        this.sessionWordsRead++;  // count this displayed word for stats
                        this.displayCurrent(interval);
                        this.updateProgress();
                        this.updateChapterSelection();
                    } else {
                        // Show the last word, then stop
                        this.sessionWordsRead++;  // the final word still counts
                        this.displayCurrent(0);
                        this.pause();
                        this.showStatus('Reading complete! 🎉', 'info');
                    }
                }, interval);
            }
            
            /**
             * Restart the tick interval after a WPM change while playing,
             * WITHOUT triggering pause()'s saveProgress POST (which would fire
             * on every step of the WPM slider drag).
             */
            _restartInterval() {
                if (this.intervalId) {
                    clearInterval(this.intervalId);
                    this.intervalId = null;
                }
                this._startInterval();
            }
            
            pause() {
                const wasPlaying = this.isPlaying;
                this.isPlaying = false;
                this.playPauseBtn.innerHTML = '▶ Play';
                // Unlock slider so user can seek while paused
                this.progressSlider.classList.remove('locked');
                if (this.intervalId) {
                    clearInterval(this.intervalId);
                    this.intervalId = null;
                }
                
                this.stopAutoSave();
                // Only save on actual play→pause transition. Without this guard,
                // per-tick input events on the slider (which call pause()) would
                // fire one save PER drag tick — tons of wasted network.
                if (wasPlaying && this.auth.isAuthenticated() && this.words.length > 0) {
                    this.saveProgress();
                }
            }
            
            rewind() {
                this.pause();
                this.currentIndex = 0;
                this.updateProgress();
                this.displayCurrent();
                this.updateChapterSelection();
                // Persist the rewind — pause() only saves on a play→pause transition,
                // so if the user was already paused we'd lose the new position on close.
                if (this.auth.isAuthenticated() && this.words.length > 0) {
                    this.saveProgress(false);
                }
            }
            
            clear() {
                this.pause();
                this.stopAutoSave();
                this.words = [];
                this.chapters = [];
                this.currentIndex = 0;
                this.currentBookHash = null;
                this.currentBookTitle = null;
                this.currentSessionId = null;
                this.wordDisplay.textContent = 'Ready to read';
                this.rollingRibbon.innerHTML = '';
                this.rollingRibbon.style.transition = 'none';
                this.rollingRibbon.style.transform = '';
                this.updateProgress();
                this.hideChapterSelector();
                this.fileInput.value = '';
                
                // Reset upload bar
                this.uploadIcon.textContent = '📖';
                this.uploadText.textContent = 'Drop your book here or tap to browse';
                this.uploadHint.textContent = 'Supports TXT, PDF, EPUB, and MOBI files';
                
                this.showStatus('Cleared. Load a new book to start.', 'info');
            }
            
            /**
             * Mode-aware display. Called on every tick and every seek.
             * @param {number} tickInterval - ms until next tick. Used by rolling mode
             *   to set the CSS transition duration for continuous motion. Pass 0 or
             *   omit for an instant snap (used for seeks, chapter jumps, pauses).
             */
            displayCurrent(tickInterval = 0) {
                if (this.words.length === 0) return;
                
                if (this.readingMode === 'rolling') {
                    // Lazy-build window if it doesn't exist or current word drifted out of it
                    const localIdx = this.currentIndex - this.rollingWindowStart;
                    const windowEnd = this.rollingWindowStart + this.rollingWindowSize;
                    const out_of_window = localIdx < 0 || localIdx >= this.rollingWindowSize;
                    // Only rebuild for drift if there are actually more words on that side
                    const more_on_left = this.rollingWindowStart > 0;
                    const more_on_right = windowEnd < this.words.length;
                    const near_end = more_on_right && localIdx > this.rollingWindowSize - this.rollingRebuildThreshold;
                    const near_start = more_on_left && localIdx < this.rollingRebuildThreshold;
                    
                    if (out_of_window || !this.rollingRibbon.firstChild) {
                        // Big discontinuity (seek, first build): snap, don't try to preserve
                        this.renderRollingWindow(0);
                    } else if (near_end || near_start) {
                        // Drift-triggered rebuild during playback: preserve visual position
                        // so the rebuild is invisible to the user. Passing tickInterval > 0
                        // tells renderRollingWindow to kick off the next animation in the
                        // same frame rather than freezing for a tick.
                        this.renderRollingWindow(tickInterval);
                    } else {
                        this.updateRollingPosition(tickInterval);
                    }
                } else {
                    this.displayWord();
                }
            }
            
            displayWord() {
                if (this.words.length === 0) return;
                this.wordDisplay.textContent = this.words[this.currentIndex];
            }
            
            // ── Rolling mode ──────────────────────────────────────────────────
            /**
             * Build a window of ~301 words around currentIndex.
             *
             * @param {number} tickInterval - If > 0 AND there was a previous DOM,
             *   preserve the current word's ON-SCREEN position across the rebuild
             *   (so the user sees no jump) and immediately kick off the next
             *   animation. This is what makes mid-playback rebuilds invisible.
             *   If 0, just snap — used for seeks, book loads, first renders.
             */
            renderRollingWindow(tickInterval = 0) {
                if (this.words.length === 0) {
                    this.rollingRibbon.innerHTML = '';
                    return;
                }
                
                // BEFORE rebuild: measure where the current word is RIGHT NOW on screen
                // (mid-animation). We'll re-place it at the same screen position after
                // the rebuild so the user sees zero discontinuity.
                let preservedScreenCenterX = null;
                if (tickInterval > 0 && this.rollingRibbon.firstChild) {
                    const oldCurrent = this.rollingRibbon.querySelector(`[data-idx="${this.currentIndex}"]`);
                    if (oldCurrent) {
                        const r = oldCurrent.getBoundingClientRect();
                        preservedScreenCenterX = r.left + r.width / 2;
                    }
                }
                
                // Center current word in the window; clamp at book edges
                const half = Math.floor(this.rollingWindowSize / 2);
                let start = Math.max(0, this.currentIndex - half);
                const end = Math.min(this.words.length, start + this.rollingWindowSize);
                start = Math.max(0, end - this.rollingWindowSize);  // re-expand left if we hit right edge
                this.rollingWindowStart = start;
                
                // Build the DOM. Using string concat + single innerHTML is much faster
                // than hundreds of createElement/appendChild calls.
                const parts = [];
                for (let i = start; i < end; i++) {
                    const cls = i === this.currentIndex ? 'rolling-word current' : 'rolling-word';
                    const safe = String(this.words[i])
                        .replace(/&/g, '&amp;')
                        .replace(/</g, '&lt;')
                        .replace(/>/g, '&gt;');
                    parts.push(`<span class="${cls}" data-idx="${i}">${safe}</span>`);
                }
                this.rollingRibbon.innerHTML = parts.join('');
                
                if (preservedScreenCenterX !== null) {
                    // SEAMLESS REBUILD: match the previous visual position exactly.
                    this._snapAndAnimate(preservedScreenCenterX, tickInterval);
                } else {
                    // Discontinuous render (seek/load): snap to center, no animation.
                    this.updateRollingPosition(0);
                }
            }
            
            /**
             * Two-step transform: (1) snap the ribbon so the current word sits at
             * `preservedScreenCenterX` on the page, (2) in the same frame, set up
             * the transition that will carry it to true center over tickInterval ms.
             *
             * Without this, a rebuild mid-animation causes the ribbon to freeze for
             * a full tick before the next one fires — the visible "break".
             */
            _snapAndAnimate(preservedScreenCenterX, tickInterval) {
                const currentEl = this.rollingRibbon.querySelector(`[data-idx="${this.currentIndex}"]`);
                if (!currentEl) return;
                
                const displayRect = this.rollingDisplay.getBoundingClientRect();
                const targetLocalX = preservedScreenCenterX - displayRect.left;
                const untranslatedCenter = currentEl.offsetLeft + currentEl.offsetWidth / 2;
                
                // Step 1: snap to preserved position (invisible — the current word
                // ends up exactly where it was before the DOM swap)
                this.rollingRibbon.style.transition = 'none';
                this.rollingRibbon.style.transform = `translateX(${targetLocalX - untranslatedCenter}px)`;
                
                // Force the browser to commit the snap before we set the new transition
                void this.rollingRibbon.offsetWidth;
                
                // Step 2: animate to true center over the remaining tick time
                const displayCenter = displayRect.width / 2;
                const targetTranslate = displayCenter - untranslatedCenter;
                this.rollingRibbon.style.transition = `transform ${tickInterval}ms linear`;
                this.rollingRibbon.style.transform = `translateX(${targetTranslate}px)`;
            }
            
            /**
             * Translate the ribbon so the current word sits at the horizontal center
             * of the reader container. On ticks, pass the interval duration to get a
             * smooth linear slide; on seeks/rebuilds, pass 0 to snap instantly.
             */
            updateRollingPosition(tickInterval = 0) {
                const currentEl = this.rollingRibbon.querySelector(`[data-idx="${this.currentIndex}"]`);
                if (!currentEl) return;
                
                // Update .current class (kept in DOM for bookkeeping; no visual effect)
                const prev = this.rollingRibbon.querySelector('.rolling-word.current');
                if (prev && prev !== currentEl) prev.classList.remove('current');
                currentEl.classList.add('current');
                
                const containerWidth = this.rollingDisplay.clientWidth;
                const untranslatedCenter = currentEl.offsetLeft + currentEl.offsetWidth / 2;
                const offset = (containerWidth / 2) - untranslatedCenter;
                
                this.rollingRibbon.style.transition = tickInterval > 0
                    ? `transform ${tickInterval}ms linear`
                    : 'none';
                this.rollingRibbon.style.transform = `translateX(${offset}px)`;
            }
            
            // ── Reading mode switching ────────────────────────────────────────
            setReadingMode(mode) {
                if (mode !== 'word' && mode !== 'rolling') return;
                const wasPlaying = this.isPlaying;
                if (wasPlaying) this.pause();
                
                this.readingMode = mode;
                localStorage.setItem('speedReaderMode', mode);
                this.applyReadingMode();
                
                // Sync UI + content for the new mode
                if (this.words.length > 0) {
                    if (mode === 'rolling') {
                        this.renderRollingWindow();
                    } else {
                        this.displayWord();
                        // Clear any leftover transform state on the ribbon
                        this.rollingRibbon.style.transition = 'none';
                        this.rollingRibbon.style.transform = '';
                    }
                }
                
                if (wasPlaying) this.play();
            }
            
            applyReadingMode() {
                // Toggle body class for CSS (show/hide the right container)
                if (this.readingMode === 'rolling') {
                    document.body.classList.add('rolling-mode');
                } else {
                    document.body.classList.remove('rolling-mode');
                }
                
                // Update the segmented control active state
                const btns = this.modeToggle.querySelectorAll('.mode-btn');
                btns.forEach(b => {
                    b.classList.toggle('active', b.dataset.mode === this.readingMode);
                });
            }
            
            // ── Chapter sync ──────────────────────────────────────────────────
            /** Returns the index (in this.chapters) of the chapter containing currentIndex, or -1. */
            getCurrentChapterIndex() {
                if (!this.chapters || this.chapters.length === 0) return -1;
                // Chapters are ordered by startIndex ascending; walk from the end.
                for (let i = this.chapters.length - 1; i >= 0; i--) {
                    if (this.currentIndex >= this.chapters[i].startIndex) return i;
                }
                return 0;
            }
            
            /**
             * Update the chapter dropdown to reflect current reading position.
             * Programmatic value assignment does NOT fire 'change', so no risk of
             * re-entering jumpToChapter().
             */
            updateChapterSelection() {
                const select = document.getElementById('chapterSelect');
                if (!select) return;
                const idx = this.getCurrentChapterIndex();
                const target = String(idx);
                if (select.value !== target) select.value = target;
            }
            
            toggleTheme() {
                this.theme = this.theme === 'night' ? 'day' : 'night';
                this.applyTheme();
                this.saveTheme();
            }
            
            applyTheme() {
                if (this.theme === 'day') {
                    document.body.classList.add('day-theme');
                    this.themeIcon.textContent = '☀️';
                    this.themeText.textContent = 'Day';
                } else {
                    document.body.classList.remove('day-theme');
                    this.themeIcon.textContent = '🌙';
                    this.themeText.textContent = 'Night';
                }
            }
            
            saveTheme() {
                localStorage.setItem('speedReaderTheme', this.theme);
            }
            
            loadTheme() {
                const savedTheme = localStorage.getItem('speedReaderTheme');
                if (savedTheme) {
                    this.theme = savedTheme;
                }
                this.applyTheme();
            }
            
            showChapterSelector() {
                // Remove existing selector if any
                this.hideChapterSelector();
                
                if (this.chapters.length === 0) return;
                
                // Chapter selector is now the LAST control group (after Controls,
                // Reading Mode, and Reading Speed). We append to the .controls div.
                const selectorHTML = `
                    <div id="chapterSelector" class="control-group" style="animation: fadeIn 0.3s ease;">
                        <label>Jump to Chapter</label>
                        <select id="chapterSelect" style="width: 100%; padding: 0.75rem; background: var(--bg-dark); 
                                color: var(--text-primary); border: 1px solid rgba(255,255,255,0.1); 
                                border-radius: 0.5rem; font-family: 'Crimson Pro', serif; font-size: 1rem;
                                cursor: pointer;">
                            ${this.chapters.map((ch, idx) => 
                                `<option value="${idx}">${ch.title}</option>`
                            ).join('')}
                        </select>
                    </div>
                `;
                
                const controlsDiv = document.querySelector('.controls');
                controlsDiv.insertAdjacentHTML('beforeend', selectorHTML);
                
                // Add event listener
                document.getElementById('chapterSelect').addEventListener('change', (e) => {
                    const chapterIndex = parseInt(e.target.value);
                    if (chapterIndex >= 0 && chapterIndex < this.chapters.length) {
                        this.jumpToChapter(chapterIndex);
                    }
                });
                
                // Reflect the current position in the dropdown immediately
                this.updateChapterSelection();
            }
            
            hideChapterSelector() {
                const existing = document.getElementById('chapterSelector');
                if (existing) existing.remove();
            }
            
            jumpToChapter(chapterIndex) {
                if (chapterIndex < 0 || chapterIndex >= this.chapters.length) return;
                
                this.pause();
                this.currentIndex = this.chapters[chapterIndex].startIndex;
                this.updateProgress();
                this.displayCurrent();
                this.updateChapterSelection();
                if (this.readingMode === 'rolling') this.renderRollingWindow();
                // Persist the jump — chapter jumps are seeks, not reading.
                if (this.auth.isAuthenticated()) this.saveProgress(false);
                this.showStatus(`Jumped to: ${this.chapters[chapterIndex].title}`, 'info');
            }
            
            updateProgress() {
                // Set slider range to match word count for 1:1 sensitivity
                this.progressSlider.max = Math.max(1, this.words.length - 1);
                this.progressSlider.value = this.currentIndex;
                
                const percentage = this.words.length > 0 
                    ? (this.currentIndex / (this.words.length - 1)) * 100 
                    : 0;
                this.progressSlider.style.setProperty('--progress', `${percentage}%`);
                
                this.progressInfo.textContent = `${this.currentIndex} / ${this.words.length} words`;
            }
            
            updateProgressDisplay() {
                // Update display without changing max (used during slider drag)
                const percentage = this.words.length > 0 
                    ? (this.currentIndex / (this.words.length - 1)) * 100 
                    : 0;
                this.progressSlider.style.setProperty('--progress', `${percentage}%`);
                this.progressInfo.textContent = `${this.currentIndex} / ${this.words.length} words`;
            }
            
            generateBookHash(filename, totalWords) {
                // Simple hash from filename and word count
                const str = `${filename}_${totalWords}`;
                let hash = 0;
                for (let i = 0; i < str.length; i++) {
                    const char = str.charCodeAt(i);
                    hash = ((hash << 5) - hash) + char;
                    hash = hash & hash; // Convert to 32bit integer
                }
                return Math.abs(hash).toString(36);
            }
            
            startAutoSave() {
                // Clear any existing interval
                if (this.autoSaveInterval) {
                    clearInterval(this.autoSaveInterval);
                }
                
                // Auto-save every 10 seconds while reading
                this.autoSaveInterval = setInterval(async () => {
                    if (this.auth.isAuthenticated() && this.words.length > 0) {
                        await this.saveProgress();
                    }
                }, 10000);
            }
            
            stopAutoSave() {
                if (this.autoSaveInterval) {
                    clearInterval(this.autoSaveInterval);
                    this.autoSaveInterval = null;
                }
            }
            
            // ── Auth UI Methods ───────────────────────────────────────────────
            initAuthUI() {
                // Auth button click
                this.authBtn.addEventListener('click', () => this.showAuthModal());
                this.logoutBtn.addEventListener('click', () => this.handleLogout());
                
                // Modal close
                this.modalClose.addEventListener('click', () => this.hideAuthModal());
                this.authModal.addEventListener('click', (e) => {
                    if (e.target === this.authModal) this.hideAuthModal();
                });
                
                // Form switching
                this.showRegister.addEventListener('click', () => this.switchToRegister());
                this.showLogin.addEventListener('click', () => this.switchToLogin());
                
                // Form submissions
                this.loginForm.addEventListener('submit', (e) => this.handleLogin(e));
                this.registerForm.addEventListener('submit', (e) => this.handleRegister(e));
            }
            
            updateAuthUI() {
                if (this.auth.isAuthenticated() && this.auth.user) {
                    // User logged in
                    this.authBtn.style.display = 'none';
                    this.userMenu.style.display = 'flex';
                    this.userInfo.textContent = this.auth.user.email;
                    
                    // Enable file upload (but keep input hidden — it's triggered via .click())
                    if (!this.currentBookTitle) {
                        this.uploadText.textContent = 'Drop your book here or tap to browse';
                        this.uploadHint.textContent = 'Supports TXT, PDF, EPUB, and MOBI files';
                    }
                    this.uploadArea.classList.remove('disabled');
                } else {
                    // User not logged in
                    this.authBtn.style.display = 'block';
                    this.userMenu.style.display = 'none';
                    
                    // Show login prompt
                    this.uploadText.textContent = 'Sign in to start reading';
                    this.uploadHint.textContent = 'Create a free account to track your progress';
                    this.uploadArea.classList.add('disabled');
                }
            }
            
            showAuthModal() {
                this.authModal.classList.add('active');
                this.switchToLogin();
            }
            
            hideAuthModal() {
                this.authModal.classList.remove('active');
                this.authError.style.display = 'none';
                this.loginForm.reset();
                this.registerForm.reset();
            }
            
            switchToLogin() {
                this.loginForm.style.display = 'block';
                this.registerForm.style.display = 'none';
                document.getElementById('modalTitle').textContent = 'Sign In';
                this.authError.style.display = 'none';
            }
            
            switchToRegister() {
                this.loginForm.style.display = 'none';
                this.registerForm.style.display = 'block';
                document.getElementById('modalTitle').textContent = 'Create Account';
                this.authError.style.display = 'none';
            }
            
            async handleLogin(e) {
                e.preventDefault();
                const email = document.getElementById('loginEmail').value;
                const password = document.getElementById('loginPassword').value;
                const submitBtn = document.getElementById('loginSubmit');
                
                try {
                    submitBtn.disabled = true;
                    submitBtn.textContent = 'Signing in...';
                    this.authError.style.display = 'none';
                    
                    await this.auth.login(email, password);
                    this.updateAuthUI();
                    this.hideAuthModal();
                    this.showStatus('✅ Signed in successfully!', 'info');
                    
                    // Load user's sessions if needed
                    await this.loadUserSessions();
                } catch (error) {
                    this.authError.textContent = error.message;
                    this.authError.style.display = 'block';
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Sign In';
                }
            }
            
            async handleRegister(e) {
                e.preventDefault();
                const email = document.getElementById('registerEmail').value;
                const password = document.getElementById('registerPassword').value;
                const fullName = document.getElementById('registerName').value;
                const submitBtn = document.getElementById('registerSubmit');
                
                try {
                    submitBtn.disabled = true;
                    submitBtn.textContent = 'Creating account...';
                    this.authError.style.display = 'none';
                    
                    await this.auth.register(email, password, fullName || null);
                    this.updateAuthUI();
                    this.hideAuthModal();
                    this.showStatus('✅ Account created! Welcome!', 'info');
                } catch (error) {
                    this.authError.textContent = error.message;
                    this.authError.style.display = 'block';
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Create Account';
                }
            }
            
            handleLogout() {
                this.auth.logout();
                this.clear();
                this.updateAuthUI();
                this.showStatus('Signed out', 'info');
            }
            
            async loadUserSessions() {
                if (!this.auth.isAuthenticated()) return;
                
                try {
                    const sessions = await this.auth.getSessions();
                    // Could show a list of recent books here
                    console.log('User sessions:', sessions);
                } catch (error) {
                    console.error('Failed to load sessions:', error);
                }
            }
            
            // Auto-save progress.
            //   countReadWords = true  → credit sessionWordsRead to stats (called from
            //                            playback pause, autosave tick, completion).
            //   countReadWords = false → purely positional save (slider seek, chapter
            //                            jump, rewind, book load). Sends delta=0.
            async saveProgress(countReadWords = true) {
                if (!this.auth.isAuthenticated() || !this.currentBookHash) return;
                
                // Atomically read-and-reset the counter BEFORE awaiting the network
                // call. If a tick fires while we're in-flight, it accumulates into
                // the next save — we won't double-count it and we won't lose it.
                let delta = 0;
                if (countReadWords) {
                    delta = this.sessionWordsRead;
                    this.sessionWordsRead = 0;
                }
                
                try {
                    const session = await this.auth.saveSession(
                        this.currentBookHash,
                        this.currentBookTitle,
                        this.currentIndex,
                        this.words.length,
                        this.wpm,
                        this.theme,
                        null,   // currentChapter — not tracked yet on the client
                        delta,
                    );
                    
                    if (session) {
                        this.currentSessionId = session.id;
                    }
                } catch (error) {
                    // Network/server error: we've already zeroed the counter, so those
                    // words are lost from stats. Acceptable tradeoff — the alternative
                    // (reset after await) would double-count any ticks that happened
                    // during the round-trip.
                    console.error('Failed to save progress:', error);
                }
            }
        }
        
        // Initialize the app
        const reader = new SpeedReader();
        
        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                    .then((registration) => {
                        console.log('ServiceWorker registration successful:', registration.scope);
                    })
                    .catch((error) => {
                        console.log('ServiceWorker registration failed:', error);
                    });
            });
        }
        
        // PWA Install Prompt
        let deferredPrompt;
        
        window.addEventListener('beforeinstallprompt', (e) => {
            // Prevent the mini-infobar from appearing on mobile
            e.preventDefault();
            // Stash the event so it can be triggered later
            deferredPrompt = e;
            // Show install button/banner if you want
            showInstallPromotion();
        });
        
        function showInstallPromotion() {
            // Optional: Show a custom install banner
            const installBanner = document.createElement('div');
            installBanner.innerHTML = `
                <div style="position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); 
                            background: var(--bg-medium); padding: 1rem 2rem; border-radius: 1rem;
                            border: 1px solid var(--accent); z-index: 1000; text-align: center;
                            box-shadow: 0 10px 40px rgba(0,0,0,0.5); animation: fadeIn 0.3s ease;">
                    <div style="color: var(--text-primary); margin-bottom: 0.5rem;">
                        📱 Install Speed Reader as an app!
                    </div>
                    <button id="installBtn" style="background: var(--accent); color: var(--bg-dark); 
                                                    padding: 0.5rem 1.5rem; border: none; border-radius: 0.5rem;
                                                    cursor: pointer; font-weight: 600;">
                        Install
                    </button>
                    <button id="dismissBtn" style="background: transparent; color: var(--text-secondary); 
                                                    padding: 0.5rem 1rem; border: none; cursor: pointer;
                                                    margin-left: 0.5rem;">
                        Not now
                    </button>
                </div>
            `;
            document.body.appendChild(installBanner);
            
            document.getElementById('installBtn').addEventListener('click', async () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    console.log(`User response: ${outcome}`);
                    deferredPrompt = null;
                    installBanner.remove();
                }
            });
            
            document.getElementById('dismissBtn').addEventListener('click', () => {
                installBanner.remove();
            });
        }
        
        // Track when app is installed
        window.addEventListener('appinstalled', () => {
            console.log('PWA installed successfully!');
            deferredPrompt = null;
        });
    </script>
</body>
</html>
