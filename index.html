<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speed Reader</title>
    
    <!-- PWA Meta Tags -->
    <meta name="description" content="Train your brain to read at lightning speed with Speed Reader">
    <meta name="theme-color" content="#00ff9d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Speed Reader">
    
    <!-- Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- iOS Icons -->
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600&family=JetBrains+Mono:wght@500;700&display=swap');
        
        :root {
            --bg-dark: #0a0e1a;
            --bg-medium: #151b2e;
            --bg-light: #1f2937;
            --accent: #00ff9d;
            --accent-dim: #00cc7d;
            --text-primary: #e5e7eb;
            --text-secondary: #9ca3af;
            --highlight: #fbbf24;
        }
        
        /* Day Theme - Kindle Style */
        body.day-theme {
            --bg-dark: #f4f1ea;
            --bg-medium: #fbf9f3;
            --bg-light: #ffffff;
            --accent: #007185;
            --accent-dim: #005a6e;
            --text-primary: #0f1111;
            --text-secondary: #565959;
            --highlight: #c45500;
        }
        
        body.day-theme::before {
            background: none;
        }
        
        /* Kindle-style reading area for day theme */
        body.day-theme .reader-container {
            background: #fbf9f3;
            border: 1px solid #ddd6c1;
            box-shadow: 
                0 2px 5px rgba(15, 17, 17, 0.05),
                inset 0 0 80px rgba(255, 255, 255, 0.3);
            position: relative;
        }
        
        /* Subtle paper texture for Kindle feel */
        body.day-theme .reader-container::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 2px,
                    rgba(15, 17, 17, 0.01) 2px,
                    rgba(15, 17, 17, 0.01) 4px
                );
            pointer-events: none;
            opacity: 0.3;
        }
        
        body.day-theme .reader-container::before {
            background: none;
        }
        
        body.day-theme #word-display {
            color: #0f1111;
            text-shadow: none;
            position: relative;
            z-index: 1;
        }
        
        /* Day theme controls styling */
        body.day-theme .controls {
            background: #ffffff;
            border: 1px solid #ddd6c1;
        }
        
        body.day-theme .upload-area {
            background: #ffffff;
            border: 2px dashed #007185;
        }
        
        body.day-theme .upload-area:hover {
            border-color: #c45500;
            background: rgba(0, 113, 133, 0.02);
        }
        
        body.day-theme .progress-container {
            background: #e7e4dc;
        }
        
        body.day-theme .progress-bar {
            background: linear-gradient(90deg, #007185, #c45500);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Crimson Pro', serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        /* Animated gradient background */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(0, 255, 157, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(251, 191, 36, 0.05) 0%, transparent 50%);
            animation: gradientShift 20s ease infinite;
            pointer-events: none;
            z-index: 0;
        }
        
        @keyframes gradientShift {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(-5%, -5%) rotate(5deg); }
        }
        
        .container {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeInDown 0.8s ease;
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header-center {
            flex: 1;
            text-align: center;
            min-width: 0;
        }
        
        .theme-toggle {
            background: var(--bg-medium);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 2rem;
            padding: 0.5rem 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.875rem;
            color: var(--text-secondary);
            flex: 0 0 auto;
            width: 110px;
        }
        
        .theme-toggle:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }
        
        .theme-icon {
            font-size: 1.2rem;
        }
        
        .auth-section {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 0.5rem;
            flex: 0 0 auto;
            width: 110px;
        }
        
        .auth-btn, .logout-btn {
            background: var(--accent);
            color: var(--bg-dark);
            border: none;
            border-radius: 2rem;
            padding: 0.5rem 1.5rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .auth-btn:hover, .logout-btn:hover {
            background: var(--highlight);
            transform: translateY(-2px);
        }
        
        .user-menu {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--bg-medium);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 2rem;
            padding: 0.4rem 0.75rem;
            max-width: 100%;
            overflow: hidden;
        }
        
        .user-info {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-secondary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 120px;
        }
        
        .logout-btn {
            padding: 0.3rem 0.75rem;
            font-size: 0.7rem;
            flex-shrink: 0;
        }
        
        h1 {
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(2rem, 5vw, 4rem);
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent) 0%, var(--highlight) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }
        
        .subtitle {
            font-size: 1.1rem;
            color: var(--text-secondary);
            font-style: italic;
        }
        
        /* Main Reading Area */
        .reader-container {
            background: var(--bg-medium);
            border-radius: 1.5rem;
            padding: 3rem;
            margin-bottom: 2rem;
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
            animation: fadeIn 1s ease 0.2s both;
        }
        
        .reader-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            opacity: 0.3;
        }
        
        #word-display {
            font-family: 'Crimson Pro', serif;
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 600;
            text-align: center;
            line-height: 1.2;
            color: var(--text-primary);
            min-height: 1.2em;
            /* Explicitly no animation/transition: one-word mode is instant swap */
            transition: none !important;
            animation: none !important;
        }
        
        /* ── Rolling Text Mode ──────────────────────────────────────────── */
        #rolling-display {
            display: none;
            width: 100%;
            overflow: hidden;
            position: relative;
            /* Fade edges so words enter/exit smoothly */
            -webkit-mask-image: linear-gradient(to right, transparent 0%, black 20%, black 80%, transparent 100%);
                    mask-image: linear-gradient(to right, transparent 0%, black 20%, black 80%, transparent 100%);
        }
        
        body.rolling-mode #word-display {
            display: none;
        }
        
        body.rolling-mode #rolling-display {
            display: block;
        }
        
        #rolling-ribbon {
            display: inline-flex;
            gap: 1.75rem;
            white-space: nowrap;
            font-family: 'Crimson Pro', serif;
            font-size: clamp(1.75rem, 4.5vw, 3rem);
            line-height: 1.2;
            will-change: transform;
            /* transition is set dynamically in JS to match WPM */
        }
        
        /* All ribbon words render identically to the one-word popup: same
           color, same weight, no dimming or "current word" highlight. The
           .current class is still applied in JS for logic/debugging, but
           has no visual effect. Edge fade comes from the container's mask. */
        .rolling-word {
            color: var(--text-primary);
            font-weight: 600;
            flex-shrink: 0;
        }
        
        /* ── Reading Mode Toggle (segmented control) ────────────────────── */
        .mode-toggle {
            display: inline-flex;
            background: var(--bg-dark);
            border-radius: 0.75rem;
            padding: 4px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        
        body.day-theme .mode-toggle {
            background: #e7e4dc;
            border-color: #ddd6c1;
        }
        
        .mode-btn {
            background: transparent;
            color: var(--text-secondary);
            padding: 0.55rem 1.2rem;
            border-radius: 0.55rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.03em;
            text-transform: none;
            border: none;
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease;
        }
        
        .mode-btn:hover {
            color: var(--text-primary);
        }
        
        .mode-btn.active {
            background: var(--accent);
            color: var(--bg-dark);
            font-weight: 600;
        }
        
        /* Disable the expensive ripple (::before width/height transition) */
        .mode-btn::before { content: none; }
        
        /* Controls Panel */
        .controls {
            background: var(--bg-light);
            border-radius: 1.5rem;
            padding: 2rem;
            margin-bottom: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
            animation: fadeIn 1s ease 0.4s both;
        }
        
        .control-group {
            margin-bottom: 1.5rem;
        }
        
        .control-group:last-child {
            margin-bottom: 0;
        }
        
        label {
            display: block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--accent);
            margin-bottom: 0.75rem;
            font-weight: 500;
        }
        
        .slider-container {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        input[type="range"] {
            flex: 1;
            height: 6px;
            border-radius: 3px;
            background: var(--bg-dark);
            outline: none;
            -webkit-appearance: none;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            box-shadow: 0 0 0 4px rgba(0, 255, 157, 0.2);
            transition: all 0.2s ease;
        }
        
        input[type="range"]::-webkit-slider-thumb:hover {
            background: var(--highlight);
            box-shadow: 0 0 0 6px rgba(251, 191, 36, 0.2);
        }
        
        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            border: none;
            box-shadow: 0 0 0 4px rgba(0, 255, 157, 0.2);
            transition: all 0.2s ease;
        }
        
        .wpm-display {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent);
            min-width: 100px;
            text-align: right;
        }
        
        /* Buttons */
        .button-group {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }
        
        button {
            font-family: 'JetBrains Mono', monospace;
            padding: 0.875rem 1.75rem;
            border: none;
            border-radius: 0.75rem;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            position: relative;
            overflow: hidden;
        }
        
        button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        
        button:active::before {
            width: 300px;
            height: 300px;
        }
        
        .btn-primary {
            background: var(--accent);
            color: var(--bg-dark);
        }
        
        .btn-primary:hover {
            background: var(--highlight);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 255, 157, 0.3);
        }
        
        .btn-secondary {
            background: var(--bg-medium);
            color: var(--text-primary);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .btn-secondary:hover {
            background: var(--bg-dark);
            border-color: var(--accent);
        }
        
        .btn-danger {
            background: #ef4444;
            color: white;
        }
        
        .btn-danger:hover {
            background: #dc2626;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(239, 68, 68, 0.3);
        }
        
        /* File Upload */
        .upload-area {
            background: var(--bg-dark);
            border: 2px dashed rgba(0, 255, 157, 0.3);
            border-radius: 1rem;
            padding: 1.25rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 1.5rem;
            animation: fadeIn 1s ease 0.6s both;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
        }
        
        .upload-area:hover {
            border-color: var(--accent);
            background: rgba(0, 255, 157, 0.05);
        }
        
        .upload-area.disabled {
            opacity: 0.7;
            cursor: default;
        }
        
        .upload-area.disabled:hover {
            border-color: rgba(0, 255, 157, 0.3);
            background: var(--bg-dark);
        }
        
        .upload-area.drag-over {
            border-color: var(--highlight);
            background: rgba(251, 191, 36, 0.1);
            transform: scale(1.02);
        }
        
        input[type="file"] {
            display: none;
        }
        
        .upload-icon {
            font-size: 1.75rem;
            opacity: 0.5;
            flex-shrink: 0;
        }
        
        .upload-content {
            text-align: left;
        }
        
        .upload-text {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 0.15rem;
        }
        
        .upload-hint {
            font-size: 0.8rem;
            color: var(--text-secondary);
            opacity: 0.7;
        }
        
        /* Progress Slider */
        .progress-container {
            margin-top: 1rem;
            margin-bottom: 0.5rem;
        }
        
        .progress-slider {
            width: 100%;
            height: 12px;
            border-radius: 6px;
            background: var(--bg-dark);
            outline: none;
            -webkit-appearance: none;
            cursor: pointer;
            position: relative;
            transition: opacity 0.2s ease;
        }
        
        /* Locked while playing — still shows progress, can't be dragged */
        .progress-slider.locked {
            pointer-events: none;
            opacity: 0.6;
        }
        
        .progress-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--accent);
            cursor: grab;
            box-shadow: 0 0 0 4px rgba(0, 255, 157, 0.2);
            transition: all 0.2s ease;
        }
        
        .progress-slider::-webkit-slider-thumb:hover {
            background: var(--highlight);
            box-shadow: 0 0 0 6px rgba(251, 191, 36, 0.2);
            transform: scale(1.1);
        }
        
        .progress-slider::-webkit-slider-thumb:active {
            cursor: grabbing;
            transform: scale(1.2);
        }
        
        .progress-slider::-moz-range-thumb {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--accent);
            cursor: grab;
            border: none;
            box-shadow: 0 0 0 4px rgba(0, 255, 157, 0.2);
            transition: all 0.2s ease;
        }
        
        .progress-slider::-moz-range-thumb:hover {
            background: var(--highlight);
            box-shadow: 0 0 0 6px rgba(251, 191, 36, 0.2);
            transform: scale(1.1);
        }
        
        .progress-slider::-moz-range-thumb:active {
            cursor: grabbing;
            transform: scale(1.2);
        }
        
        /* Progress fill effect */
        .progress-slider::-webkit-slider-runnable-track {
            height: 12px;
            border-radius: 6px;
            background: linear-gradient(
                to right,
                var(--accent) 0%,
                var(--accent) var(--progress, 0%),
                var(--bg-dark) var(--progress, 0%),
                var(--bg-dark) 100%
            );
        }
        
        .progress-slider::-moz-range-track {
            height: 12px;
            border-radius: 6px;
            background: var(--bg-dark);
        }
        
        .progress-slider::-moz-range-progress {
            height: 12px;
            border-radius: 6px;
            background: var(--accent);
        }
        
        .progress-info {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.875rem;
            color: var(--text-secondary);
            text-align: center;
            margin-top: 0.5rem;
        }
        
        /* Auth Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: var(--bg-medium);
            border-radius: 1.5rem;
            padding: 2.5rem;
            max-width: 450px;
            width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: modalSlideIn 0.3s ease;
        }
        
        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        
        .modal-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.5rem;
            color: var(--accent);
        }
        
        .modal-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
            transition: color 0.3s ease;
        }
        
        .modal-close:hover {
            color: var(--accent);
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-label {
            display: block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }
        
        .form-input {
            width: 100%;
            background: var(--bg-dark);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
            font-family: 'Crimson Pro', serif;
            font-size: 1rem;
            color: var(--text-primary);
            transition: border-color 0.3s ease;
        }
        
        .form-input:focus {
            outline: none;
            border-color: var(--accent);
        }
        
        .form-submit {
            width: 100%;
            background: var(--accent);
            color: var(--bg-dark);
            border: none;
            border-radius: 0.75rem;
            padding: 0.875rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .form-submit:hover {
            background: var(--highlight);
            transform: translateY(-2px);
        }
        
        .form-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .form-divider {
            text-align: center;
            margin: 1.5rem 0;
            color: var(--text-secondary);
            font-size: 0.875rem;
        }
        
        .form-switch {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }
        
        .form-switch-link {
            color: var(--accent);
            cursor: pointer;
            text-decoration: underline;
        }
        
        .form-switch-link:hover {
            color: var(--highlight);
        }
        
        .form-error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
            padding: 0.75rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
            font-size: 0.875rem;
        }
        
        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Status Messages */
        .status-message {
            text-align: center;
            padding: 1rem;
            border-radius: 0.75rem;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            animation: fadeIn 0.3s ease;
        }
        
        .status-info {
            background: rgba(0, 255, 157, 0.1);
            color: var(--accent);
            border: 1px solid rgba(0, 255, 157, 0.2);
        }
        
        .status-error {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }
            
            header {
                flex-direction: column;
                gap: 1rem;
            }
            
            .theme-toggle, .auth-section {
                position: static;
            }
            
            .user-info {
                font-size: 0.75rem;
                max-width: 150px;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            
            .modal-content {
                padding: 2rem 1.5rem;
            }
            
            .reader-container {
                padding: 2rem 1rem;
                min-height: 300px;
            }
            
            #word-display {
                font-size: clamp(2rem, 10vw, 4rem);
            }
            
            .controls {
                padding: 1.5rem;
            }
            
            .button-group {
                flex-direction: column;
            }
            
            button {
                width: 100%;
            }
        }
    </style>
</head>

    <!-- Auth Modal -->
    <div class="modal" id="authModal">

                    <input type="password" class="form-input" id="registerPassword" required minlength="8">
